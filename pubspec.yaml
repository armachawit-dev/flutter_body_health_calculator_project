name: flutter_body_health_calculator_project_1
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  page_transition: ^2.2.2
  flutter_launcher_icons: ^0.14.4
  pretty_animated_buttons: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  font_awesome_flutter: ^10.8.0

# ⚠️ ตั้งค่าให้อยู่ระดับชิดซ้ายสุด (ห้ามเยื้องเข้าไปข้างใน dev_dependencies หรือ flutter)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/